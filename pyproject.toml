[project]
name = "faultline"
version = "0.1.0"
description = "Finds where an organisation's documented knowledge contradicts itself."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "falkordb>=1.0.10",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph", "agent"]
