<circle cx="824" cy="48" r="14" fill="none" stroke="#7A828A" stroke-width="2.2"/><path d="M817.7 43.0l5.0 5.0l-5.0 5.0M824.0 43.0l5.0 5.0l-5.0 5.0" fill="none" stroke="#7A828A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="850.0" y="46.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1A1D21" text-anchor="start">Superseded</text><text x="850.0" y="68.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5C636B" text-anchor="start">a newer decision replaced it</text>
