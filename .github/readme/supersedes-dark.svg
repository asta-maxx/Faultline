<title id="t">Adjudication by traversal, not timestamp</title><desc id="d">The runbook was updated more recently but cites ADR-41, which ADR-63 and then ADR-88 supersede. Timestamp logic picks the runbook's 30 minutes, which is wrong. Walking SUPERSEDES picks ADR-88's 15 minutes.</desc>
