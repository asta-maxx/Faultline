<text x="66.0" y="196.0" font-family="Spectral, 'Iowan Old Style', Georgia, serif" font-size="30" font-weight="500" fill="#E8E3D9" text-anchor="start">Your company disagrees with itself.</text>
<text x="66.0" y="236.0" font-family="Spectral, 'Iowan Old Style', Georgia, serif" font-size="30" font-weight="500" fill="#E8E3D9" text-anchor="start">Faultline finds where.</text>
<text x="66.0" y="278.0" font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#9A948A" text-anchor="start">It ranks every contradiction by what sits downstream of it,</text>
