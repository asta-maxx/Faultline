<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Faultline</title><desc id="d">The Faultline mark and wordmark: your company disagrees with itself, Faultline finds where. Beside it, the path behind one answer: a runbook asserts 30 minutes, a policy asserts 15 minutes and cites ADR-88, which supersedes ADR-41; the two claims are joined by a CONTRADICTS edge.</desc>
