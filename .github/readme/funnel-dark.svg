<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">The four-stage funnel</title><desc id="d">Measured on a synthetic graph: 780 possible pairs, 56 after the graph collapse, 12 after the deterministic prefilter, at most 12 LLM calls.</desc>
<rect x="0.5" y="0.5" width="1199" height="559" rx="18" fill="#0F141A" stroke="#2A323C"/>
<defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8D96A0"/></marker></defs>
<text x="56.0" y="66.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FF7A3D" text-anchor="start" letter-spacing="1.6">STAGE 1</text>
<text x="56.0" y="94.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="650" fill="#E6EDF3" text-anchor="start">All possible pairs</text>
<text x="56.0" y="120.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8D96A0" text-anchor="start">n·(n−1)/2 · counted, never enumerated</text>
<rect x="460.0" y="44" width="620.0" height="88" rx="14" fill="#E6EDF3" fill-opacity="1.00"/>
<text x="770.0" y="102.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="750" fill="#0F141A" text-anchor="middle">780</text>
<line x1="770.0" y1="136.0" x2="770.0" y2="152.0" stroke="#8D96A0" stroke-width="1.8" marker-end="url(#ar-muted)"/>
<text x="56.0" y="178.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FF7A3D" text-anchor="start" letter-spacing="1.6">STAGE 2</text>
<text x="56.0" y="206.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="650" fill="#E6EDF3" text-anchor="start">Graph collapse</text>
<text x="56.0" y="232.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8D96A0" text-anchor="start">shared Entity · Cypher §7.1</text>
<rect x="552.9" y="156" width="434.1" height="88" rx="14" fill="#E6EDF3" fill-opacity="0.88"/>
<text x="770.0" y="214.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="750" fill="#0F141A" text-anchor="middle">56</text>
<line x1="770.0" y1="248.0" x2="770.0" y2="264.0" stroke="#8D96A0" stroke-width="1.8" marker-end="url(#ar-muted)"/>
<text x="56.0" y="290.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FF7A3D" text-anchor="start" letter-spacing="1.6">STAGE 3</text>
<text x="56.0" y="318.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="650" fill="#E6EDF3" text-anchor="start">Deterministic prefilter</text>
<text x="56.0" y="344.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8D96A0" text-anchor="start">same predicate · object or polarity differs</text>
<rect x="607.3" y="268" width="325.4" height="88" rx="14" fill="#E6EDF3" fill-opacity="0.76"/>
<text x="770.0" y="326.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="750" fill="#0F141A" text-anchor="middle">12</text>
<line x1="770.0" y1="360.0" x2="770.0" y2="376.0" stroke="#8D96A0" stroke-width="1.8" marker-end="url(#ar-muted)"/>
<text x="56.0" y="402.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FF7A3D" text-anchor="start" letter-spacing="1.6">STAGE 4</text>
<text x="56.0" y="430.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="650" fill="#E6EDF3" text-anchor="start">LLM judgement</text>
<text x="56.0" y="456.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8D96A0" text-anchor="start">Adjudicator · every call cached</text>
<rect x="607.3" y="381" width="325.4" height="86" rx="14" fill="none" stroke="#E6EDF3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="770.0" y="438.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="750" fill="#E6EDF3" text-anchor="middle">≤ 12</text>
<path d="M1132 88 H1146 V312 H1132" fill="none" stroke="#FF7A3D" stroke-width="2"/>
<g transform="translate(1164 200) rotate(90)"><text x="0.0" y="0.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FF7A3D" text-anchor="middle">65× fewer</text></g>
<text x="56.0" y="538.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8D96A0" text-anchor="start">Measured on the 40-claim, 12-entity synthetic graph by python -m graph.collapse_demo. Stage 4 is an upper bound until the Adjudicator lands.</text>
</svg>
