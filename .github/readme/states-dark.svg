<title id="t">Claim states</title><desc id="d">Live: a check in a circle. Contradicted: a cross in a circle. Superseded: a double chevron in a circle.</desc>
<rect x="0.5" y="0.5" width="1199" height="95" rx="18" fill="#0F141A" stroke="#2A323C"/>
<circle cx="64" cy="48" r="14" fill="none" stroke="#51CF66" stroke-width="2.2"/><path d="M57.7 48.0l4.4 4.7l8.5 -9.4" fill="none" stroke="#51CF66" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="90.0" y="46.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3" text-anchor="start">Live</text><text x="90.0" y="68.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8D96A0" text-anchor="start">current, nothing contradicts it</text>
<circle cx="444" cy="48" r="14" fill="none" stroke="#FF6B6B" stroke-width="2.2"/><path d="M437.7 41.7L450.3 54.3M450.3 41.7L437.7 54.3" fill="none" stroke="#FF6B6B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="470.0" y="46.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3" text-anchor="start">Contradicted</text><text x="470.0" y="68.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8D96A0" text-anchor="start">in an open conflict</text>
<circle cx="824" cy="48" r="14" fill="none" stroke="#9AA3AD" stroke-width="2.2"/><path d="M817.7 43.0l5.0 5.0l-5.0 5.0M824.0 43.0l5.0 5.0l-5.0 5.0" fill="none" stroke="#9AA3AD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="850.0" y="46.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E6EDF3" text-anchor="start">Superseded</text><text x="850.0" y="68.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8D96A0" text-anchor="start">a newer decision replaced it</text>
