<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">Architecture</title><desc id="d">Documents, messages and tickets flow into the Surveyor, which extracts claims into FalkorDB. The funnel reads from FalkorDB: graph collapse, deterministic prefilter, then the Adjudicator, which writes CONTRADICTS edges and Conflicts back. FastAPI and MCP serve the ranked queue to the web UI.</desc>
